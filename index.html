<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trace ID Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .overflow-y-auto.scrollbar-thin,
    .overflow-x-auto.scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    html, body {
      height: 100%;
    }
    main {
      flex-grow: 1;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="mb-10 text-center pt-8">
    <h1 class="text-4xl font-extrabold text-sky-700 tracking-tight">
      Trace ID Analyzer
    </h1>
    <p class="mt-2 text-lg text-slate-600 max-w-3xl mx-auto">
      Enter any supported trace header. Invalid primary ID inputs won't sync other ID fields. Baggage fields sync independently.
    </p>
  </header>

  <main class="max-w-full mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div id="root"></div>
  </main>

  <footer class="mt-auto pt-8 pb-8 text-center text-sm text-slate-500">
    <p>&copy; 2026 Trace ID Analyzer. Cards synchronize based on valid inputs.</p>
  </footer>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
